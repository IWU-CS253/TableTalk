<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TableTalk Login</title>
    <! adding a bootstrap style sheet although Jillian is not sure if we need this yet.>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <! Add this to its own stylesheet>

    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <l

</head>
<body>

    <! Pre-existing account log in section>
    <div class="login-container">
        <div class="logo">WELCOME TO TABLETALK</div>

        <! Ability to actually flash the messages to the user when they enter an unidentifiable login sequence>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <! Required username submission section>
            <div class="mb-3">
                <label for="username" class="form-label">USERNAME</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <! Required password submission section>
            <div class="mb-3">
                <label for="password" class="form-label">PASSWORD</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-login w-100">LOGIN</button>
        </form>
    </div>

    <! Allow new user sign up>
    <div style="text-align: center">
        <! Direct text added to the bottom of the page above the signup for new users button>
        Don't have an account?
        <button onclick="window.location.href= '{{ url_for('sign_up') }}'" type="submit" class="btn btn-login w-100">SIGN UP HERE</button>
    </div>

    <! Javascript insertion (not sure if needed yet)>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.js"></script>
</body>
</html>
